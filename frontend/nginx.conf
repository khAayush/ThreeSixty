# Nginx config for ThreeSixty frontend container
# Serves the React SPA and reverse-proxies /api and /socket.io to the backend.
# This means only port 80 needs to be exposed publicly.

server {
    listen 80;
    server_name _;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ── Backend REST API proxy ─────────────────────────────────────────────────
    # All /api/* requests are forwarded to the backend container.
    # proxy_pass without a trailing URI preserves the full /api/... path.
    location /api/ {
        proxy_pass         http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Support larger request bodies (base64 images in chat)
        client_max_body_size 10m;

        # Prevent gateway timeouts on slow DB operations
        proxy_read_timeout 60s;
    }

    # ── Socket.IO proxy (WebSocket + long-polling) ────────────────────────────
    # Must appear before the catch-all / location.
    # The Upgrade/Connection headers enable WebSocket handshake.
    location /socket.io/ {
        proxy_pass             http://backend:5000;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade     $http_upgrade;
        proxy_set_header       Connection  "upgrade";
        proxy_set_header       Host        $host;
        proxy_set_header       X-Real-IP   $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass     $http_upgrade;

        # Long timeout needed for persistent WebSocket connections
        proxy_read_timeout     86400s;
        proxy_send_timeout     86400s;
    }

    # ── React SPA ─────────────────────────────────────────────────────────────
    # All other requests serve the built React bundle.
    # try_files falls back to index.html so React Router handles client-side routing.
    location / {
        root       /usr/share/nginx/html;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Cache static assets aggressively (Vite hashes filenames on build)
        location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
